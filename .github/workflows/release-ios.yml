name: Release (iOS BRAT)

# Automates iOS prerelease publishing for BRAT-based testing.
#
# Triggered on every push to `release/ios`: builds the plugin,
# bumps the iOS version suffix (`X.Y.Z-ios.N`), commits the bump
# back to the branch (with `[skip ci]` to avoid re-trigger), and
# creates a GitHub Release for BRAT to pick up.
#
# Also supports `workflow_dispatch` with an optional version override
# for manual releases (e.g. to synchronise with a `next` baseline).
#
# Why a separate workflow from release.yml:
#   release.yml targets upstream's main/next semver scheme
#   (X.Y.Z / X.Y.Z-beta.N). The iOS fork uses a parallel version
#   track that must not collide with upstream tags, and produces
#   only the plugin bundle (no daemon binaries).

on:
  push:
    branches: [release/ios]
  workflow_dispatch:
    inputs:
      version:
        description: >
          Explicit version (e.g. 1.1.1-ios.5). Leave empty to
          auto-increment the last iOS prerelease suffix.
        required: false
        type: string

concurrency:
  group: release-ios
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build + bump + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        working-directory: plugin
        run: npm ci

      - name: Production build
        working-directory: plugin
        run: node esbuild.config.mjs production

      - name: Bump iOS version
        id: bump
        working-directory: plugin
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            node scripts/bump-ios-brat.mjs "${{ inputs.version }}"
          else
            node scripts/bump-ios-brat.mjs
          fi
          echo "version=$(jq -r '.version' manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            plugin/manifest.json \
            manifest.json \
            manifest-beta.json
          git commit -m "chore(release): bump to ${{ steps.bump.outputs.version }} [skip ci]"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.bump.outputs.version }}
          body: |
            ## iOS BRAT prerelease

            - **Version**: ${{ steps.bump.outputs.version }}
            - **Baseline**: ${{ github.sha }}

            Install via BRAT with the beta toggle enabled — this release
            is marked as a prerelease so BRAT's `--beta` filter picks it up.
          files: |
            plugin/main.js
            plugin/manifest.json
            manifest.json
            manifest-beta.json
            plugin/styles.css
          draft: false
          prerelease: true
          make_latest: false
