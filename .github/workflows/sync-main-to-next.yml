name: Sync main → next

# After every push to main (i.e. after a `next → main` promotion lands),
# open a PR that brings main back into next so the two branches don't
# accumulate divergence. Without this, every promotion PR also has to
# carry the previous promotion's merge commit, eventually requiring
# manual `git merge main` on next.
#
# Why a PR (not a direct push):
#   • next has branch protection — the workflow can't fast-forward push
#     without admin bypass, and we don't want to bypass branch protection
#     even for an automated sync.
#   • A PR runs the same CI matrix that human PRs do, so a regression
#     introduced by the merge surfaces here, not on the next contributor.
#
# Why `--auto` (not `--merge` directly):
#   `--auto` tells GitHub to merge once all required checks pass. If
#   checks fail or there's a conflict, the PR sits open and notifies
#   the maintainer to resolve manually. Auto-merge must be enabled on
#   the repo (Settings → General → Pull Requests → Allow auto-merge).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-next
  cancel-in-progress: false

jobs:
  sync:
    name: Open sync PR (main → next)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if main is ahead of next
        id: ahead
        run: |
          set -euo pipefail
          git fetch origin next:refs/remotes/origin/next
          ahead=$(git rev-list --count origin/next..origin/main)
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "main is $ahead commits ahead of next"

      - name: Create or reuse sync PR + enable auto-merge
        if: steps.ahead.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Find an existing open sync PR first — re-running the
          # workflow shouldn't spawn duplicates.
          existing=$(gh pr list --base next --head main --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            url=$(gh pr create \
              --base next --head main \
              --title "sync: main → next" \
              --body "Automatic post-promotion sync. Brings the merge commit from the latest \`next → main\` release back into \`next\` so the two branches rejoin.

Generated by \`.github/workflows/sync-main-to-next.yml\`. Auto-merge will fire when CI passes.")
            num=$(echo "$url" | grep -oE '[0-9]+$' | tail -1)
            echo "Created PR #$num: $url"
          else
            num="$existing"
            echo "Reusing open PR #$num"
          fi
          gh pr merge "$num" --merge --auto

      - name: No-op (already in sync)
        if: steps.ahead.outputs.ahead == '0'
        run: echo "main and next are already aligned — nothing to sync."
